<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Finder — Balisto</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e13;--surface:#13161e;--card:#181c26;--border:#22273a;--muted:#2a2f42;
  --text:#e8eaf2;--sub:#5a6080;
  --lead:#34c98a;--lead-bg:rgba(52,201,138,.1);--lead-bd:rgba(52,201,138,.3);
  --b2b:#f7a24f; --b2b-bg:rgba(247,162,79,.1); --b2b-bd:rgba(247,162,79,.3);
  --cust:#c97cf4;--cust-bg:rgba(201,124,244,.1);--cust-bd:rgba(201,124,244,.3);
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 55% 35% at 10% 5%,rgba(52,201,138,.05),transparent 65%),
             radial-gradient(ellipse 45% 30% at 90% 90%,rgba(201,124,244,.05),transparent 65%);
  pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:48px 20px 100px}

/* Header */
header{text-align:center;margin-bottom:44px}
.logo{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--sub);margin-bottom:14px}
.logo em{color:#4f8ef7;font-style:normal}
h1{font-family:'Syne',sans-serif;font-size:clamp(28px,5.5vw,44px);font-weight:800;
  letter-spacing:-.02em;line-height:1.1;
  background:linear-gradient(135deg,var(--text) 40%,var(--sub));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{margin-top:10px;color:var(--sub);font-size:14px}

/* Step label */
.step-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--sub);margin-bottom:12px}

/* Tab grid */
.tab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:36px}
.tab-btn{padding:18px 12px;border-radius:14px;cursor:pointer;text-align:center;
  background:var(--surface);border:1.5px solid var(--border);transition:all .2s;user-select:none}
.tab-btn:hover{border-color:var(--muted)}
.tb-icon{font-size:24px;margin-bottom:8px}
.tb-label{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub);transition:color .2s}
.tb-sub{font-size:11px;color:var(--muted);margin-top:3px}
.tab-btn.sel-leads    {border-color:var(--lead);background:var(--lead-bg)}
.tab-btn.sel-leads    .tb-label{color:var(--lead)}
.tab-btn.sel-b2b      {border-color:var(--b2b); background:var(--b2b-bg)}
.tab-btn.sel-b2b      .tb-label{color:var(--b2b)}
.tab-btn.sel-customers{border-color:var(--cust);background:var(--cust-bg)}
.tab-btn.sel-customers .tb-label{color:var(--cust)}

/* Search panel */
#searchPanel{display:none;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Four inputs */
.four-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:480px){.four-inputs{grid-template-columns:1fr}}
.fi-group{display:flex;flex-direction:column;gap:6px}
.fi-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--sub);padding-left:2px}
.fi-input{background:var(--surface);border:1.5px solid var(--border);border-radius:11px;
  padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);
  outline:none;transition:border-color .2s,box-shadow .2s}
.fi-input::placeholder{color:var(--muted)}
.fi-input:focus{border-color:#4f8ef7;box-shadow:0 0 0 3px rgba(79,142,247,.1)}
.fi-leads:focus    {border-color:var(--lead)!important;box-shadow:0 0 0 3px rgba(52,201,138,.1)!important}
.fi-b2b:focus      {border-color:var(--b2b)!important; box-shadow:0 0 0 3px rgba(247,162,79,.1)!important}
.fi-customers:focus{border-color:var(--cust)!important;box-shadow:0 0 0 3px rgba(201,124,244,.1)!important}

/* Search row */
.search-row{display:flex;gap:10px;margin-bottom:8px}
.btn-search{flex:1;padding:14px;border:none;border-radius:12px;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:#fff;
  cursor:pointer;transition:opacity .2s,transform .1s}
.btn-search:active{transform:scale(.98)}
.btn-leads    {background:var(--lead)}
.btn-b2b      {background:var(--b2b)}
.btn-customers{background:var(--cust)}
.btn-reset{padding:14px 20px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--sub);
  cursor:pointer;transition:all .2s}
.btn-reset:hover{border-color:var(--muted);color:var(--text)}

/* Status */
#status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);
  min-height:20px;margin:16px 0 12px}
.spinner{width:13px;height:13px;border:2px solid var(--border);
  border-top-color:#4f8ef7;border-radius:50%;animation:spin .55s linear infinite;display:none}
.spinner.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Results header */
.res-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;
  padding-bottom:10px;border-bottom:1px solid var(--border)}
.res-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot-leads    {background:var(--lead);box-shadow:0 0 6px var(--lead)}
.dot-b2b      {background:var(--b2b); box-shadow:0 0 6px var(--b2b)}
.dot-customers{background:var(--cust);box-shadow:0 0 6px var(--cust)}
.res-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.title-leads    {color:var(--lead)}
.title-b2b      {color:var(--b2b)}
.title-customers{color:var(--cust)}
.res-count{margin-left:auto;font-size:11px;color:var(--sub);
  background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 10px}

/* Cards */
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;
  overflow:hidden;cursor:pointer;
  transition:border-color .2s,box-shadow .15s,transform .15s;
  animation:fadeUp .22s ease both}
.card:hover{transform:translateY(-1px)}
.card-leads:hover    {border-color:var(--lead);box-shadow:0 4px 20px rgba(52,201,138,.12)}
.card-b2b:hover      {border-color:var(--b2b); box-shadow:0 4px 20px rgba(247,162,79,.12)}
.card-customers:hover{border-color:var(--cust);box-shadow:0 4px 20px rgba(201,124,244,.12)}

.card-head{display:flex;align-items:center;gap:12px;padding:14px 16px}
.id-pill{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;
  padding:4px 11px;border-radius:7px;white-space:nowrap;flex-shrink:0}
.pill-leads    {background:var(--lead-bg);color:var(--lead)}
.pill-b2b      {background:var(--b2b-bg); color:var(--b2b)}
.pill-customers{background:var(--cust-bg);color:var(--cust)}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-loc{font-size:12px;color:var(--sub);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chevron{color:var(--sub);font-size:11px;transition:transform .2s;flex-shrink:0}
.card.open .chevron{transform:rotate(180deg)}

.card-body{display:none;padding:14px 16px 16px;border-top:1px solid var(--border)}
.card.open .card-body{display:block}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:7px;padding:5px 10px;font-size:12px;color:var(--sub)}
.tag strong{color:var(--text);font-weight:500}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:20px}
.badge-leads    {background:var(--lead-bg);color:var(--lead);border:1px solid var(--lead-bd)}
.badge-b2b      {background:var(--b2b-bg); color:var(--b2b); border:1px solid var(--b2b-bd)}
.badge-customers{background:var(--cust-bg);color:var(--cust);border:1px solid var(--cust-bd)}
.linked{font-size:11px;color:var(--sub);margin-bottom:10px}
.linked strong{color:var(--text)}
.copy-row{display:flex;gap:8px;margin-top:4px}
.copy-field{flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;
  font-size:13px;color:var(--text);outline:none}
.copy-btn{padding:9px 16px;border:none;border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;white-space:nowrap}
.cbtn-leads    {background:var(--lead-bg);color:var(--lead);border:1px solid var(--lead-bd)}
.cbtn-b2b      {background:var(--b2b-bg); color:var(--b2b); border:1px solid var(--b2b-bd)}
.cbtn-customers{background:var(--cust-bg);color:var(--cust);border:1px solid var(--cust-bd)}
.copy-btn.done{background:#1a3028!important;color:var(--lead)!important;border-color:var(--lead-bd)!important}

/* Empty / idle */
.empty{text-align:center;padding:48px 0;color:var(--sub);font-size:14px}
.empty .ei{font-size:44px;margin-bottom:12px}
.empty h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}

@media(max-width:480px){
  .tab-grid{grid-template-columns:1fr}
  .tab-btn{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px}
  .tb-icon{font-size:20px;margin-bottom:0}
}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">&#9670; <em>Balisto</em> &nbsp;ID Finder</div>
    <h1>Find Any ID</h1>
    <p>Select the ID type, fill in what you know, and search</p>
  </header>

  <!-- Step 1 -->
  <div class="step-label">Step 1 — What are you looking for?</div>
  <div class="tab-grid">
    <div class="tab-btn" data-tab="leads" onclick="selectTab(this)">
      <div class="tb-icon">🌱</div>
      <div class="tb-label">Individual Lead ID</div>
      <div class="tb-sub">All Leads sheet</div>
    </div>
    <div class="tab-btn" data-tab="b2b" onclick="selectTab(this)">
      <div class="tb-icon">🤝</div>
      <div class="tb-label">Dealer & Partner ID</div>
      <div class="tb-sub">B2B Leads sheet</div>
    </div>
    <div class="tab-btn" data-tab="customers" onclick="selectTab(this)">
      <div class="tb-icon">✅</div>
      <div class="tb-label">Customer Onboarding ID</div>
      <div class="tb-sub">Customer ID sheet</div>
    </div>
  </div>

  <!-- Step 2 -->
  <div id="searchPanel">
    <div class="step-label">Step 2 — Fill in any field (or multiple)</div>
    <div class="four-inputs" id="fourInputs">
      <div class="fi-group">
        <label class="fi-label">Name</label>
        <input class="fi-input" id="f-name"     type="text" placeholder="e.g. Vijay Borhate"
               autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="fi-group">
        <label class="fi-label">Contact Number</label>
        <input class="fi-input" id="f-contact"  type="text" placeholder="e.g. 9356960359"
               autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="fi-group">
        <label class="fi-label">Taluka</label>
        <input class="fi-input" id="f-taluka"   type="text" placeholder="e.g. Rahuri"
               autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <div class="fi-group">
        <label class="fi-label">District</label>
        <input class="fi-input" id="f-district" type="text" placeholder="e.g. Satara"
               autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <!-- B2B only -->
      <div class="fi-group" id="extra-b2b" style="display:none">
        <label class="fi-label">Company / Entity Name</label>
        <input class="fi-input" id="f-company" type="text" placeholder="e.g. Shrikant Tractors"
               autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
      <!-- Customer only -->
      <div class="fi-group" id="extra-customers" style="display:none">
        <label class="fi-label">Legal Name of Business</label>
        <input class="fi-input" id="f-bizname" type="text" placeholder="e.g. Vinod Enterprises"
               autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()">
      </div>
    </div>
    <div class="search-row">
      <button class="btn-search" id="searchBtn" onclick="doSearch()">Search</button>
      <button class="btn-reset" onclick="resetInputs()">Clear</button>
    </div>
  </div>

  <!-- Status -->
  <div id="status" style="display:none">
    <div class="spinner" id="spinner"></div>
    <span id="statusText"></span>
  </div>

  <!-- Results -->
  <div id="results"></div>

</div>
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2AS0NLBjBC-yN2Mu-o93m-hbXU0Jt1kFOtz1j_A9iYfX8hrSZZXIBGIkH7fHB-wbT/exec";

let activeTab = "";

function selectTab(el) {
  document.querySelectorAll(".tab-btn").forEach(b => b.className = "tab-btn");
  activeTab = el.dataset.tab;
  el.classList.add("sel-" + activeTab);

  // Show panel + style inputs & button
  document.getElementById("searchPanel").style.display = "block";
  document.getElementById("searchBtn").className = "btn-search btn-" + activeTab;

  // Color input focus ring by tab
  document.querySelectorAll(".fi-input").forEach(inp => {
    inp.classList.remove("fi-leads","fi-b2b","fi-customers");
    inp.classList.add("fi-" + activeTab);
  });

  // Show/hide extra fields
  document.getElementById("extra-b2b").style.display       = activeTab === "b2b"       ? "" : "none";
  document.getElementById("extra-customers").style.display = activeTab === "customers"  ? "" : "none";

  // Clear everything
  resetInputs();
  document.getElementById("results").innerHTML = "";
  document.getElementById("status").style.display = "none";

  document.getElementById("f-name").focus();
}

function resetInputs() {
  ["f-name","f-contact","f-taluka","f-district","f-company","f-bizname"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
}

// Search: send each filled field as a separate request, merge & deduplicate
async function doSearch() {
  if (!activeTab) { alert("Please select an ID type first."); return; }

  const fields = {
    name:     document.getElementById("f-name").value.trim(),
    contact:  document.getElementById("f-contact").value.trim(),
    taluka:   document.getElementById("f-taluka").value.trim(),
    district: document.getElementById("f-district").value.trim(),
    ...(activeTab === "b2b"       && { company: document.getElementById("f-company").value.trim() }),
    ...(activeTab === "customers" && { bizname: document.getElementById("f-bizname").value.trim() })
  };

  const active = Object.entries(fields).filter(([,v]) => v.length >= 2);
  if (active.length === 0) {
    showStatus("Fill in at least one field (min 2 characters)", false);
    return;
  }

  showStatus("Searching…", true);
  document.getElementById("results").innerHTML = "";

  try {
    // Fire one request per filled field, then merge
    const requests = active.map(([field, q]) =>
      fetch(`${APPS_SCRIPT_URL}?tab=${activeTab}&field=${field}&q=${encodeURIComponent(q)}`)
        .then(r => r.json())
    );
    const responses = await Promise.all(requests);

    // Deduplicate by ID
    const seen = new Set();
    const merged = [];
    responses.forEach(arr => {
      arr.forEach(item => {
        if (!seen.has(item.id)) { seen.add(item.id); merged.push(item); }
      });
    });

    renderResults(merged);
  } catch(err) {
    showStatus("⚠️ Could not reach the server. Check your Apps Script deployment.", false);
  }
}

function renderResults(items) {
  const n = items.length;
  showStatus(`${n} result${n!==1?"s":""} found`, false);

  if (n === 0) {
    document.getElementById("results").innerHTML =
      `<div class="empty"><div class="ei">😶</div>
       <h3>No matches found</h3>
       <p>Try a different name, number, taluka or district.</p></div>`;
    return;
  }

  const titles = { leads:"Individual Lead IDs", b2b:"Dealer & Partner IDs", customers:"Customer Onboarding IDs" };
  let html = `<div class="res-header">
    <div class="res-dot dot-${activeTab}"></div>
    <span class="res-title title-${activeTab}">${titles[activeTab]}</span>
    <span class="res-count">${n} found</span>
  </div><div class="cards">`;

  items.forEach((r,i) => {
    html += activeTab==="leads" ? leadCard(r,i)
          : activeTab==="b2b"   ? b2bCard(r,i)
          : custCard(r,i);
  });
  html += "</div>";
  document.getElementById("results").innerHTML = html;
}

function leadCard(r,i) {
  const loc = [r.village,r.taluka,r.district].filter(Boolean).join(", ");
  return buildCard(r.id, r.name, loc,
    `<span class="badge badge-leads">${esc(r.type||"Lead")}</span>`,
    `<span class="tag">📞 <strong>${esc(r.mobile)}</strong></span>${loc?`<span class="tag">📍 <strong>${esc(loc)}</strong></span>`:""}`,
    "", i);
}

function b2bCard(r,i) {
  const loc = [r.village,r.taluka,r.district].filter(Boolean).join(", ");
  const t = (r.type||"").toLowerCase();
  const bc = t.includes("dealer")?"badge-b2b":"badge-leads";
  return buildCard(r.id, r.name, r.company||loc,
    `<span class="badge ${bc}">${esc(r.type||"B2B")}</span>`,
    `<span class="tag">📞 <strong>${esc(r.mobile)}</strong></span>
     ${loc?`<span class="tag">📍 <strong>${esc(loc)}</strong></span>`:""}
     ${r.company?`<span class="tag">🏢 <strong>${esc(r.company)}</strong></span>`:""}`,
    "", i);
}

function custCard(r,i) {
  const loc = [r.village,r.taluka,r.district,r.state].filter(Boolean).join(", ");
  const linked = r.linkedId?`<div class="linked">Linked ID: <strong>${esc(r.linkedId)}</strong></div>`:"";
  return buildCard(r.id, r.name||r.bizName, r.bizName||loc,
    `<span class="badge badge-customers">${esc(r.type||"Customer")}</span>`,
    `<span class="tag">📞 <strong>${esc(r.mobile)}</strong></span>
     ${loc?`<span class="tag">📍 <strong>${esc(loc)}</strong></span>`:""}`,
    linked, i);
}

function buildCard(id, name, sub, badge, tagsHTML, extra, i) {
  return `<div class="card card-${activeTab}" style="animation-delay:${i*30}ms" onclick="toggleCard(this)">
    <div class="card-head">
      <div class="id-pill pill-${activeTab}">${esc(id)}</div>
      <div class="card-info">
        <div class="card-name">${esc(name)}</div>
        ${sub?`<div class="card-loc">${esc(sub)}</div>`:""}
      </div>
      <span class="chevron">▼</span>
    </div>
    <div class="card-body">
      <div class="tags">${badge}${tagsHTML}</div>
      ${extra}
      <div class="copy-row">
        <input class="copy-field" readonly value="${esc(id)}" onclick="this.select()">
        <button class="copy-btn cbtn-${activeTab}" onclick="copyId(event,this,'${esc(id)}')">Copy ID</button>
      </div>
    </div>
  </div>`;
}

function toggleCard(el) { el.classList.toggle("open"); }

function copyId(e, btn, id) {
  e.stopPropagation();
  navigator.clipboard.writeText(id).then(() => {
    btn.textContent = "Copied ✓";
    btn.classList.add("done");
    setTimeout(() => { btn.textContent = "Copy ID"; btn.classList.remove("done"); }, 2000);
  });
}

function showStatus(msg, loading) {
  const el = document.getElementById("status");
  el.style.display = "flex";
  document.getElementById("spinner").classList.toggle("on", loading);
  document.getElementById("statusText").textContent = msg;
}

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
</body>
</html>
